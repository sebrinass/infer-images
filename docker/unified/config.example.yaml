# placeholder example configuration
healthCheckTimeout: 300
logRequests: true

models:
  "llama":
    cmd: >
      llama-server
      -hf bartowski/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M
      --port ${PORT}

  "tts":
    checkEndpoint: /health
    cmd: >
      audiocpp_server
      --task tts
      --family qwen3_tts
      --model /models/qwen3-tts
      --port ${PORT}

  # SGLang is the primary agent-reasoning backend (RadixAttention prefix
  # sharing). Uses the isolated /opt/sglang-venv; --kv-cache-dtype fp8_e4m3
  # halves KV cache memory (best on Ampere sm86 and newer).
  "sglang-agent":
    cmd: >
      /opt/sglang-venv/bin/python -m sglang.launch_server
      --model-path Qwen/Qwen3-7B-Instruct
      --port ${PORT}
      --kv-cache-dtype fp8_e4m3

  # Edge0 145B / 120B (latent-MoE, derived from Qwen3.8-Flash-Next). Needs the
  # opt-in engine in the image (`./build-image.sh --edge0`) - it is off by
  # default since 2026-11-16. The packs
  # stay on the host - each is 40-100 GB - and are mounted read-only, e.g.
  #   -v /mnt/user/appdata/edge0/Edge0-120B-q3k:/models/Edge0-120B-q3k:ro
  # The launcher fills the engine template's placeholders and starts the
  # Python server on ${PORT}; it is used instead of edge0-infer because that
  # front-end accepts only one GPU. Both cards:
  #   env: ["EDGE0_GPU=0,1", "EDGE0_EXTRA_ARGS=--expert-cache-device1 auto"]
  # The 48 GiB PLE table is read straight from disk (ple-io=direct), so it must
  # sit on NVMe, never on the spinning array.
  "Edge0-120b":
    checkEndpoint: /health
    ttl: 1800
    cmd: /opt/edge0/run /models/Edge0-120B-q3k

  "Edge0-145b":
    checkEndpoint: /health
    ttl: 1800
    cmd: /opt/edge0/run /models/Edge0-145B-q3k

